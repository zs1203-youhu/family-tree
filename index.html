function render(){renderTree();renderGen();}
function renderTree(){const c=document.getElementById('tree-canvas');c.innerHTML='';c.style.transform=`translate(${TRANSX}px,${TRANSY}px) scale(${SCALE})`;const roots=M.filter(m=>!m.p);roots.forEach(r=>c.appendChild(buildNode(r)));}
function buildNode(m){if(FILTER==='zhou'&&!m.n.includes('周'))return null;const node=document.createElement('div');node.className='node';const card=document.createElement('div');card.className=`card gen-${m.gen}`;card.innerHTML=`<span class="gen-badge">${m.gen}</span><div class="cname">${m.n}</div>`+(m.b||m.d?`<div class="cdates">${m.b||''}${m.d?' 殁'+m.d:''}</div>`:'')+(m.s?`<div class="cspouse">♥ ${m.s}</div>`:'');card.onclick=()=>openEdit(m.id);
// Drag
let dragT;
card.onmousedown=e=>{if(e.button!==0)return;dragT=setTimeout(()=>{startDrag(m.id,e);},200);};
card.onmouseup=()=>{clearTimeout(dragT);};
card.ontouchstart=e=>{dragT=setTimeout(()=>{startDrag(m.id,e.touches[0]);},300);};
card.ontouchend=()=>{clearTimeout(dragT);};
node.appendChild(card);
const children=M.filter(c=>c.p===m.id);
if(children.length>0){const v=document.createElement('div');v.className='vline';node.appendChild(v);const row=document.createElement('div');row.className='children-row';children.forEach(ch=>{const col=document.createElement('div');col.className='child-col';col.appendChild(buildNode(ch));row.appendChild(col);});node.appendChild(row);}
return node;}
function startDrag(id,e){if(TOUCHING)return;TOUCHING=true;const card=document.querySelector(`.card[onclick*="${id}"]`);if(card){card.classList.add('dragging');document.body.onmousemove=onDragMove;document.body.onmouseup=onDragEnd;document.body.ontouchmove=onDragTouchMove;document.body.ontouchend=onDragTouchEnd;}}
function onDragMove(e){if(!e.target.closest('.card'))return;const card=e.target.closest('.card');if(card)card.classList.add('drop-target');}
function onDragEnd(e){clearDrag();const card=e.target.closest('.card');if(card&&card.classList.contains('drop-target')){const tid=parseInt(card.onclick.toString().match(/\d+/)[0]);if(tid!==EDIT){const dm=M.find(x=>x.id===EDIT);if(dm&&confirm(`将 ${dm.n} 移到 ${M.find(x=>x.id===tid).n} 下？`)){dm.p=tid;save();render();}}}
function onDragTouchMove(e){const t=e.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);if(el){const card=el.closest('.card');if(card)card.classList.add('drop-target');}}
function onDragTouchEnd(e){clearDrag();const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);if(el){const card=el.closest('.card');if(card&&card.classList.contains('drop-target')){const tid=parseInt(card.onclick.toString().match(/\d+/)[0]);if(tid!==EDIT){const dm=M.find(x=>x.id===EDIT);if(dm&&confirm(`将 ${dm.n} 移到 ${M.find(x=>x.id===tid).n} 下？`)){dm.p=tid;save();render();}}}}
function clearDrag(){TOUCHING=false;document.body.onmousemove=null;document.body.onmouseup=null;document.body.ontouchmove=null;document.body.ontouchend=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('dragging','drop-target'));}
function renderGen(){const c=document.getElementById('gen-view');c.innerHTML='';const max=Math.max(...M.map(m=>m.gen));for(let g=1;g<=max;g++){const ms=M.filter(m=>m.gen===g);if(!ms.length)continue;const sec=document.createElement('div');sec.className='gen-sec';sec.innerHTML=`<div class="gen-hdr"><div class="gen-dot" style="background:${GCOL[g]}"></div><div>${GNAM[g]} (${ms.length}人)</div></div><div class="gen-cards"></div>`;const cards=sec.querySelector('.gen-cards');ms.forEach(m=>{const gc=document.createElement('div');gc.className=`gcard gen-${m.gen}`;gc.style.borderLeftColor=GCOL[m.gen];const p=M.find(x=>x.id===m.p);gc.innerHTML=`<div class="gname">${m.n}</div>`+(m.b?`<div class="gdates">生 ${m.b}${m.d?' 殁 '+m.d:''}</div>`:'')+(m.s?`<div class="gspouse">♥ ${m.s}</div>`:'')+(p?`<div class="gparent">↑ ${p.n}</div>`:'');gc.onclick=()=>openEdit(m.id);cards.appendChild(gc);});c.appendChild(sec);}}
function openAdd(){EDIT=null;document.getElementById('mtitle').textContent='添加';['f-name','f-birth','f-death','f-spouse','f-spouseBirth','f-bio'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-gender').value='男';document.getElementById('f-gen').value='5';popParent();document.getElementById('btn-del').style.display='none';document.getElementById('modal').classList.add('on');}
function openEdit(id){EDIT=id;const m=M.find(x=>x.id===id);if(!EDIT)return;document.getElementById('mtitle').textContent='编辑';document.getElementById('f-name').value=m.n;document.getElementById('f-gender').value=m.g;document.getElementById('f-birth').value=m.b;document.getElementById('f-death').value=m.d;document.getElementById('f-spouse').value=m.s;document.getElementById('f-spouseBirth').value=m.sb;document.getElementById('f-gen').value=m.gen;document.getElementById('f-bio').value=m.bio||'';popParent(m.id,m.p);document.getElementById('btn-del').style.display='inline-block';document.getElementById('modal').classList.add('on');}
function popParent(curId,curP){const s=document.getElementById('f-parent');s.innerHTML='<option value="">— 无 —</option>';M.filter(m=>m.id!==curId).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=`${m.n}（第${m.gen}代）`;if(m.id===curP)o.selected=true;s.appendChild(o);});}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function saveMember(){const n=document.getElementById('f-name').value.trim();if(!n){alert('姓名必填');return;}const d={n,gender:document.getElementById('f-gender').value,b:document.getElementById('f-birth').value.trim(),d:document.getElementById('f-death').value.trim(),s:document.getElementById('f-spouse').value.trim(),sb:document.getElementById('f-spouseBirth').value.trim(),gen:parseInt(document.getElementById('f-gen').value),p:document.getElementById('f-parent').value?parseInt(document.getElementById('f-parent').value):null,bio:document.getElementById('f-bio').value.trim()};if(EDIT){Object.assign(M.find(m=>m.id===EDIT),d);}else{M.push({id:NI++,...d});}save();closeModal();render();}
function delMember(){if(!EDIT)return;const m=M.find(x=>x.id===EDIT);if(!confirm(`删除 ${m.n}？`))return;M.filter(c=>c.p===EDIT).forEach(c=>c.p=m.p);M=M.filter(x=>x.id!==EDIT);save();closeModal();render();}
function exportCSV(){const BOM='\uFEFF';const hdr=['姓名','性别','出生','殁于','配偶','配偶出生','代数','父节点','生平'].join(',');const rows=M.map(m=>{const p=M.find(x=>x.id===m.p);return[m.n,m.g,m.b,m.d,m.s,m.sb,'第'+m.gen+'代',p?p.n:'',m.bio||''].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(',');});const csv=BOM+[hdr,...rows].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='周氏家谱.csv';a.click();}
// Zoom/Pan
const tv=document.getElementById('tree-view');let panning=false,panStart={x:0,y:0};tv.onmousedown=e=>{if(e.target===tv||e.target.id==='tree-canvas'){panning=true;panStart={x:e.clientX-TRANSX,y:e.clientY-TRANSY};e.preventDefault();}};
tv.onmousemove=e=>{if(panning){TRANSX=e.clientX-panStart.x;TRANSY=e.clientY-panStart.y;render();}};
tv.onmouseup=()=>panning=false;
tv.onwheel=e=>{if(e.ctrlKey){e.preventDefault();SCALE+=e.deltaY>0?-0.1:0.1;SCALE=Math.max(0.3,Math.min(2,SCALE));render();}};
tv.ontouchstart=e=>{if(e.touches.length===2){tv.style.cursor='grabbing';}};
tv.ontouchmove=e=>{if(e.touches.length===2){e.preventDefault();}};
document.onkeydown=e=>{if(e.key==='Escape')closeModal();};
</script>
</body>
</html>
