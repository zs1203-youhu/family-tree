<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
  }

  /* ===== LOGIN ===== */
  #login-screen {
    position: fixed; inset: 0;
    background: #f5f5f7;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    width: 360px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    text-align: center;
  }
  .login-card h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-card p { color: #6e6e73; font-size: 15px; margin-bottom: 32px; }
  .login-card input {
    width: 100%; padding: 14px 16px;
    border: 1.5px solid #d2d2d7; border-radius: 12px;
    font-size: 16px; font-family: inherit;
    outline: none; margin-bottom: 16px;
    transition: border-color .2s;
  }
  .login-card input:focus { border-color: #0071e3; }
  .login-card button {
    width: 100%; padding: 14px;
    background: #0071e3; color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .login-card button:hover { background: #0077ed; }
  .login-error { color: #ff3b30; font-size: 14px; margin-top: 10px; min-height: 20px; }

  /* ===== APP ===== */
  #app { display: none; }

  /* ===== HEADER ===== */
  header {
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    position: sticky; top: 0; z-index: 100;
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .header-title { font-size: 20px; font-weight: 700; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .view-toggle {
    display: flex; background: #f5f5f7; border-radius: 10px; padding: 3px;
  }
  .view-btn {
    padding: 6px 16px; border: none; background: transparent;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    cursor: pointer; color: #6e6e73; transition: all .2s;
  }
  .view-btn.active {
    background: #fff; color: #1d1d1f; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  }
  .btn-pdf {
    padding: 7px 16px; border: none;
    background: #0071e3; color: #fff;
    border-radius: 10px; font-size: 14px; font-family: inherit;
    font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .btn-pdf:hover { background: #0077ed; }

  /* ===== MAIN ===== */
  main { padding: 32px 24px; max-width: 1400px; margin: 0 auto; }

  /* ===== TREE VIEW ===== */
  #tree-view { overflow-x: auto; }
  .tree-root { display: flex; justify-content: center; }
  .tree-node {
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  /* vertical line from parent card bottom to children connector */
  .tree-node-children-wrapper {
    display: flex; flex-direction: column; align-items: center;
    width: 100%;
  }
  .tree-vline {
    width: 2px; height: 28px;
    background: #c7c7cc;
  }
  .tree-hline-row {
    display: flex; align-items: flex-start;
    position: relative;
  }
  /* horizontal connector above siblings */
  .tree-hline-row::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; right: 50%;
    height: 2px;
    background: #c7c7cc;
  }
  .tree-child-col {
    display: flex; flex-direction: column; align-items: center;
  }
  .tree-vline-up {
    width: 2px; height: 20px;
    background: #c7c7cc;
  }

  /* member card */
  .member-card {
    background: #fff;
    border-radius: 14px;
    padding: 12px 16px;
    min-width: 140px;
    max-width: 180px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: box-shadow .2s, transform .15s;
    border: 2px solid transparent;
    text-align: center;
    margin: 0 8px;
  }
  .member-card:hover {
    box-shadow: 0 6px 24px rgba(0,113,227,0.15);
    transform: translateY(-2px);
    border-color: #0071e3;
  }
  .member-card .name {
    font-size: 15px; font-weight: 700; margin-bottom: 4px;
    color: #1d1d1f;
  }
  .member-card .dates {
    font-size: 12px; color: #6e6e73; line-height: 1.5;
  }
  .member-card .spouse-info {
    font-size: 12px; color: #8e8e93; margin-top: 4px;
    border-top: 1px solid #f0f0f5; padding-top: 4px;
  }
  .member-card.male { border-left: 4px solid #0071e3; }
  .member-card.female { border-left: 4px solid #ff2d55; }
  .member-card.unknown { border-left: 4px solid #8e8e93; }

  /* gen label */
  .gen-badge {
    font-size: 11px; color: #8e8e93; margin-bottom: 4px;
  }

  /* ===== GENERATION VIEW ===== */
  #gen-view { display: none; }
  .gen-section { margin-bottom: 36px; }
  .gen-title {
    font-size: 18px; font-weight: 700; margin-bottom: 16px;
    padding: 10px 20px;
    background: #fff; border-radius: 12px;
    display: inline-block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    color: #0071e3;
  }
  .gen-members {
    display: flex; flex-wrap: wrap; gap: 14px;
  }
  .gen-members .member-card {
    min-width: 160px; text-align: left;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    width: 480px;
    max-width: 95vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    transform: scale(0.95);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block; font-size: 13px; font-weight: 600;
    color: #6e6e73; margin-bottom: 6px;
  }
  .modal-field input,
  .modal-field textarea,
  .modal-field select {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #d2d2d7; border-radius: 10px;
    font-size: 15px; font-family: inherit;
    outline: none; transition: border-color .2s;
    background: #fff;
  }
  .modal-field input:focus,
  .modal-field textarea:focus,
  .modal-field select:focus { border-color: #0071e3; }
  .modal-field textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
  .btn-save {
    padding: 10px 24px; background: #0071e3; color: #fff;
    border: none; border-radius: 10px;
    font-size: 15px; font-family: inherit; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .btn-save:hover { background: #0077ed; }
  .btn-cancel {
    padding: 10px 20px; background: #f5f5f7; color: #1d1d1f;
    border: none; border-radius: 10px;
    font-size: 15px; font-family: inherit;
    cursor: pointer; transition: background .2s;
  }
  .btn-cancel:hover { background: #e8e8ed; }

  /* ===== PRINT ===== */
  @media print {
    header, .modal-overlay, #login-screen { display: none !important; }
    body { background: #fff; }
    .member-card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    main { padding: 0; }
  }
</style>
</head>

<!-- LOGIN -->
<div id="login-screen">

    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>

      </div>

    </div>
  </header>
  <main>

    <div id="gen-view"></div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>编辑成员信息</h2>
    <div class="modal-field">
      <label>姓名</label>
      <input type="text" id="edit-name" />
    </div>
    <div class="modal-field">
      <label>性别</label>
      <select id="edit-gender">
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="未知">未知</option>
      </select>
    </div>
    <div class="modal-field">
      <label>出生（例：1895.1.7）</label>
      <input type="text" id="edit-birth" placeholder="出生日期" />
    </div>
    <div class="modal-field">
      <label>逝世</label>
      <input type="text" id="edit-death" placeholder="逝世日期" />
    </div>
    <div class="modal-field">
      <label>配偶姓名</label>
      <input type="text" id="edit-spouse" placeholder="配偶姓名" />
    </div>
    <div class="modal-field">
      <label>配偶出生</label>
      <input type="text" id="edit-spouseBirth" placeholder="配偶出生日期" />
    </div>
    <div class="modal-field">
      <label>生平简介</label>
      <textarea id="edit-bio"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

  {id:68,name:"陈彤秋芷",gender:"未知",birth:"2012.10.8",death:"",spouse:"",spouseBirth:"",gen:6,parentId:37,bio:""}
];

// ===== STATE =====
let members = [];
let editingId = null;
const GEN_NAMES = ['', '一世', '二世', '三世', '四世', '五世', '六世'];
const STORAGE_KEY = 'zhou_family_tree_v1';

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      members = JSON.parse(saved);
    } else {
      members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
    }
  } catch(e) {
    members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
}

function getMember(id) {
  return members.find(m => m.id === id);
}

function getChildren(parentId) {
  return members.filter(m => m.parentId === parentId);
}

// ===== LOGIN =====
function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  if (pwd === 'zhou1895') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
    renderAll();
  } else {
    document.getElementById('login-error').textContent = '密码错误，请重试';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

document.getElementById('pwd-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ===== VIEW SWITCH =====
let currentView = 'tree';

function switchView(v) {
  currentView = v;
  document.getElementById('tree-view').style.display = v === 'tree' ? '' : 'none';
  document.getElementById('gen-view').style.display = v === 'gen' ? '' : 'none';
  document.getElementById('btn-tree').classList.toggle('active', v === 'tree');
  document.getElementById('btn-gen').classList.toggle('active', v === 'gen');
}

// ===== RENDER =====
function renderAll() {
  renderTree();
  renderGen();
}

// --- TREE VIEW ---
function renderTree() {
  const container = document.getElementById('tree-view');
  container.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'tree-root';

  // Find roots (parentId null)
  const roots = members.filter(m => m.parentId === null);
  const row = buildTreeRow(roots);
  wrapper.appendChild(row);
  container.appendChild(wrapper);
}

function buildTreeRow(nodes) {
  if (!nodes || nodes.length === 0) return document.createDocumentFragment();
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.alignItems = 'flex-start';
  row.style.justifyContent = 'center';
  row.style.position = 'relative';

  // Draw horizontal connector if more than 1 sibling
  if (nodes.length > 1) {
    row.classList.add('tree-hline-row');
  }

  nodes.forEach((node, i) => {
    const col = document.createElement('div');
    col.className = 'tree-child-col';

    if (nodes.length > 1) {
      const vlineUp = document.createElement('div');
      vlineUp.className = 'tree-vline-up';
      col.appendChild(vlineUp);
    }

    const card = buildCard(node);
    col.appendChild(card);

    const children = getChildren(node.id);
    if (children.length > 0) {
      const vline = document.createElement('div');
      vline.className = 'tree-vline';
      col.appendChild(vline);

      const childRow = buildTreeRow(children);
      col.appendChild(childRow);
    }

    row.appendChild(col);
  });

  // Draw horizontal line above siblings
  if (nodes.length > 1) {
    setTimeout(() => drawHLine(row, nodes.length), 0);
  }

  return row;
}

function drawHLine(row, count) {
  // We use CSS pseudo element approach via inline style instead
  const cols = row.querySelectorAll(':scope > .tree-child-col');
  if (cols.length < 2) return;
  const firstCard = cols[0].querySelector('.member-card');
  const lastCard = cols[cols.length - 1].querySelector('.member-card');
  if (!firstCard || !lastCard) return;
  const rowRect = row.getBoundingClientRect();
  const firstRect = firstCard.getBoundingClientRect();
  const lastRect = lastCard.getBoundingClientRect();
  const left = firstRect.left + firstRect.width / 2 - rowRect.left;
  const right = lastRect.left + lastRect.width / 2 - rowRect.left;
  row.style.setProperty('--hline-left', left + 'px');
  row.style.setProperty('--hline-right', 'calc(100% - ' + right + 'px)');
}

function buildCard(member) {
  const card = document.createElement('div');
  const gClass = member.gender === '男' ? 'male' : member.gender === '女' ? 'female' : 'unknown';
  card.className = 'member-card ' + gClass;
  card.dataset.id = member.id;

  const genBadge = document.createElement('div');
  genBadge.className = 'gen-badge';
  genBadge.textContent = GEN_NAMES[member.gen] || ('第' + member.gen + '世');

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = member.name;

  const dates = document.createElement('div');
  dates.className = 'dates';
  let datesText = '';
  if (member.birth) datesText += '生：' + member.birth;
  if (member.death) datesText += (datesText ? '\n' : '') + '殁：' + member.death;
  if (!datesText) datesText = '生卒不详';
  dates.style.whiteSpace = 'pre-line';
  dates.textContent = datesText;

  card.appendChild(genBadge);
  card.appendChild(name);
  card.appendChild(dates);

  if (member.spouse) {
    const spouseInfo = document.createElement('div');
    spouseInfo.className = 'spouse-info';
    spouseInfo.textContent = '配偶：' + member.spouse;
    if (member.spouseBirth) spouseInfo.textContent += '（' + member.spouseBirth + '）';
    card.appendChild(spouseInfo);
  }

  card.addEventListener('click', () => openModal(member.id));
  return card;
}

// --- GEN VIEW ---
function renderGen() {
  const container = document.getElementById('gen-view');
  container.innerHTML = '';

  const maxGen = Math.max(...members.map(m => m.gen));
  for (let g = 1; g <= maxGen; g++) {
    const genMembers = members.filter(m => m.gen === g);
    if (genMembers.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'gen-section';

    const title = document.createElement('div');
    title.className = 'gen-title';
    title.textContent = (GEN_NAMES[g] || ('第' + g + '世')) + '（共' + genMembers.length + '人）';
    section.appendChild(title);

    const membersDiv = document.createElement('div');
    membersDiv.className = 'gen-members';
    genMembers.forEach(m => {
      const card = buildCard(m);
      membersDiv.appendChild(card);
    });
    section.appendChild(membersDiv);
    container.appendChild(section);
  }
}

// ===== MODAL =====
function openModal(id) {
  editingId = id;
  const m = getMember(id);
  document.getElementById('edit-name').value = m.name;
  document.getElementById('edit-gender').value = m.gender;
  document.getElementById('edit-birth').value = m.birth;
  document.getElementById('edit-death').value = m.death;
  document.getElementById('edit-spouse').value = m.spouse;
  document.getElementById('edit-spouseBirth').value = m.spouseBirth;
  document.getElementById('edit-bio').value = m.bio;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

// override for button
document.querySelector('.btn-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
});

function saveEdit() {
  if (!editingId) return;
  const idx = members.findIndex(m => m.id === editingId);
  if (idx === -1) return;
  members[idx].name = document.getElementById('edit-name').value.trim();
  members[idx].gender = document.getElementById('edit-gender').value;
  members[idx].birth = document.getElementById('edit-birth').value.trim();
  members[idx].death = document.getElementById('edit-death').value.trim();
  members[idx].spouse = document.getElementById('edit-spouse').value.trim();
  members[idx].spouseBirth = document.getElementById('edit-spouseBirth').value.trim();
  members[idx].bio = document.getElementById('edit-bio').value.trim();
  saveData();
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
  renderAll();
}

// ===== HORIZONTAL LINE (CSS var approach) =====
// We use a simple SVG-less CSS approach: after render, inject inline style
function applyHLines() {
  document.querySelectorAll('.tree-hline-row').forEach(row => {
    const cols = Array.from(row.children);
    if (cols.length < 2) return;
    const firstVline = cols[0].querySelector('.tree-vline-up');
    const lastVline = cols[cols.length - 1].querySelector('.tree-vline-up');
    if (!firstVline || !lastVline) return;
    const rowRect = row.getBoundingClientRect();
    const firstRect = firstVline.getBoundingClientRect();
    const lastRect = lastVline.getBoundingClientRect();
    const left = firstRect.left + firstRect.width / 2 - rowRect.left;
    const right = lastRect.left + lastRect.width / 2 - rowRect.left;

    // Add a pseudo-element via a real element
    let hline = row.querySelector('.hline-bar');
    if (!hline) {
      hline = document.createElement('div');
      hline.className = 'hline-bar';
      hline.style.cssText = `
        position:absolute; top:0; height:2px; background:#c7c7cc; pointer-events:none;
      `;
      row.style.position = 'relative';
      row.appendChild(hline);
    }
    hline.style.left = left + 'px';
    hline.style.width = (right - left) + 'px';
  });
}

// Re-apply on resize
window.addEventListener('resize', applyHLines);
// Override renderTree to call applyHLines after DOM settles
const _origRenderTree = renderTree;
function renderTree() {
  _origRenderTree.call(this);
  requestAnimationFrame(() => requestAnimationFrame(applyHLines));
}
</script>
