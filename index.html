<!-- 登录页 -->
<div id="login-page">

    <button class="login-btn" onclick="doLogin()">进入家谱</button>
    <div class="login-error" id="login-error">密码错误，请重试</div>
  </div>
</div>

<!-- 主页面 -->
<div id="main-page">
  <header>
    <div>
      <h1>🌳 周氏至德堂家族谱</h1>
      <p>共同维护 · 传承家史</p>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" onclick="openAddModal(null)">+ 添加成员</button>
      <button class="btn btn-outline" onclick="exportData()">📥 导出数据</button>
      <button class="btn btn-outline" onclick="logout()">退出</button>
    </div>
  </header>
  <div class="zibi-bar">
    字辈：朋昌魁林伍 · 廷玉佩保真 · 诗书延世泽 · 礼乐振家声 · 忠孝承先业 · 贤良裕后昆 · 祖宗传至德 · 丕焕我人文
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 搜索家族成员..." oninput="renderTree()">
    <span class="member-count" id="member-count"></span>
  </div>
  <div class="tree-container">
    <div class="tree" id="tree-root"></div>
  </div>
</div>

<!-- 编辑/添加弹窗 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="modal-title">编辑成员信息</h2>
    <div class="form-row">
      <div class="form-group">
        <label>姓名 *</label>
        <input type="text" id="f-name" placeholder="如：周诗锦">
      </div>
      <div class="form-group">
        <label>性别</label>
        <select id="f-gender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="未知">未知</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>出生日期</label>
        <input type="text" id="f-birth" placeholder="如：1978.9.25">
      </div>
      <div class="form-group">
        <label>殁于</label>
        <input type="text" id="f-death" placeholder="如：2009.5.18（在世留空）">
      </div>
    </div>
    <div class="form-group">
      <label>配偶姓名</label>
      <input type="text" id="f-spouse" placeholder="配偶姓名">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>配偶出生日期</label>
        <input type="text" id="f-spouse-birth" placeholder="如：1980.3.14">
      </div>
      <div class="form-group">
        <label>所属代数</label>
        <select id="f-gen">
          <option value="1">第一代</option>
          <option value="2">第二代（绿色）</option>
          <option value="3">第三代（紫色）</option>

          <option value="5">第五代（蓝色）</option>
          <option value="6">第六代（灰色）</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>父亲/母亲（父母姓名，用顿号分隔）</label>
      <input type="text" id="f-parents" placeholder="如：周诗荣、彭宏">
    </div>
    <div class="form-group">
      <label>生平简介</label>
      <textarea id="f-bio" placeholder="记录这位家族成员的生平事迹、职业、重要事件等..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="delete-btn" onclick="deleteMember()" style="display:none">删除</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-save" onclick="saveMember()">保存</button>
    </div>
  </div>
</div>

// ==================== 颜色配置 ====================
const genColors = {
  1: '#8b4513', 2: '#4a7c59', 3: '#7b68b5',
  4: '#c9a84c', 5: '#4a90d9', 6: '#95a5a6'
};
const genNames = {
  1: '第一代', 2: '第二代', 3: '第三代',
  4: '第四代', 5: '第五代', 6: '第六代'
};

// ==================== 登录 ====================
function doLogin() {
  const pwd = document.getElementById('password-input').value;
  if (pwd === ACCESS_PASSWORD) {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    // 尝试加载本地存储的数据
    const saved = localStorage.getItem('zhou-family-data');
    if (saved) {
      try { familyData = JSON.parse(saved); } catch(e) {}
    }
    renderTree();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function logout() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('password-input').value = '';
}

// ==================== 渲染树 ====================
function renderTree() {
  const query = document.getElementById('search-input').value.trim().toLowerCase();
  const root = document.getElementById('tree-root');
  root.innerHTML = '';

  const maxGen = Math.max(...familyData.members.map(m => m.gen));

  for (let g = 1; g <= maxGen; g++) {
    let members = familyData.members.filter(m => m.gen === g);
    if (query) {
      members = members.filter(m =>
        m.name.toLowerCase().includes(query) ||
        m.spouse.toLowerCase().includes(query) ||
        m.bio.toLowerCase().includes(query) ||
        m.parents.toLowerCase().includes(query)
      );
    }
    if (members.length === 0 && query) continue;

    const row = document.createElement('div');
    row.className = `generation-row gen-${g}`;

    const label = document.createElement('div');
    label.className = 'gen-label';
    label.innerHTML = `<div style="color:${genColors[g]};font-size:18px">●</div><div>${genNames[g]}</div>`;
    row.appendChild(label);

    const membersDiv = document.createElement('div');
    membersDiv.className = 'gen-members';

    members.forEach(m => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.style.borderTopColor = genColors[g];
      card.onclick = () => openEditModal(m.id);

      let datesHtml = '';
      if (m.birth) datesHtml += `生 ${m.birth}`;
      if (m.death) datesHtml += ` 殁 ${m.death}`;

      card.innerHTML = `
        <div class="edit-icon">✏️</div>
        <div class="member-name">${m.name}</div>
        ${datesHtml ? `<div class="member-dates">${datesHtml}</div>` : ''}
        ${m.spouse ? `<div class="member-spouse">♥ ${m.spouse}${m.spouseBirth ? ' (' + m.spouseBirth + ')' : ''}</div>` : ''}
        ${m.parents ? `<div class="member-dates" style="color:#aaa">↑ ${m.parents}</div>` : ''}
        ${m.bio ? `<div class="member-bio">${m.bio}</div>` : ''}
      `;
      membersDiv.appendChild(card);
    });

    // 添加成员按钮
    if (!query) {
      const addBtn = document.createElement('div');
      addBtn.className = 'add-member-btn';
      addBtn.innerHTML = '＋ 添加';
      addBtn.onclick = () => openAddModal(g);
      membersDiv.appendChild(addBtn);
    }

    row.appendChild(membersDiv);
    root.appendChild(row);

    if (g < maxGen) {
      const divider = document.createElement('hr');
      divider.className = 'gen-divider';
      root.appendChild(divider);
    }
  }

  document.getElementById('member-count').textContent = `共 ${familyData.members.length} 位成员`;
}

// ==================== 弹窗 ====================
let editingId = null;

function openEditModal(id) {
  const m = familyData.members.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  document.getElementById('modal-title').textContent = '编辑成员信息';
  document.getElementById('f-name').value = m.name;
  document.getElementById('f-gender').value = m.gender;
  document.getElementById('f-birth').value = m.birth;
  document.getElementById('f-death').value = m.death;
  document.getElementById('f-spouse').value = m.spouse;
  document.getElementById('f-spouse-birth').value = m.spouseBirth;
  document.getElementById('f-gen').value = m.gen;
  document.getElementById('f-parents').value = m.parents;
  document.getElementById('f-bio').value = m.bio;
  document.getElementById('delete-btn').style.display = 'inline-block';
  document.getElementById('edit-modal').classList.add('active');
}

function openAddModal(gen) {
  editingId = null;
  document.getElementById('modal-title').textContent = '添加新成员';
  document.getElementById('f-name').value = '';
  document.getElementById('f-gender').value = '男';
  document.getElementById('f-birth').value = '';
  document.getElementById('f-death').value = '';
  document.getElementById('f-spouse').value = '';
  document.getElementById('f-spouse-birth').value = '';
  document.getElementById('f-gen').value = gen || 5;
  document.getElementById('f-parents').value = '';
  document.getElementById('f-bio').value = '';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('edit-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('active');
}

function saveMember() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('请填写姓名'); return; }

  const data = {
    name,
    gender: document.getElementById('f-gender').value,
    birth: document.getElementById('f-birth').value.trim(),
    death: document.getElementById('f-death').value.trim(),
    spouse: document.getElementById('f-spouse').value.trim(),
    spouseBirth: document.getElementById('f-spouse-birth').value.trim(),
    gen: parseInt(document.getElementById('f-gen').value),
    parents: document.getElementById('f-parents').value.trim(),
    bio: document.getElementById('f-bio').value.trim(),
  };

  if (editingId) {
    const idx = familyData.members.findIndex(x => x.id === editingId);
    familyData.members[idx] = { ...familyData.members[idx], ...data };
  } else {
    familyData.members.push({ id: familyData.nextId++, ...data });
  }

  saveData();
  closeModal();
  renderTree();
}

function deleteMember() {
  if (!editingId) return;
  const m = familyData.members.find(x => x.id === editingId);
  if (!confirm(`确认删除「${m.name}」？此操作不可撤销。`)) return;
  familyData.members = familyData.members.filter(x => x.id !== editingId);
  saveData();
  closeModal();
  renderTree();
}

function saveData() {
  localStorage.setItem('zhou-family-data', JSON.stringify(familyData));
}

function exportData() {
  const blob = new Blob([JSON.stringify(familyData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '周氏家谱数据.json';
  a.click();
}

// 点击遮罩关闭
document.getElementById('edit-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// 回车登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});
